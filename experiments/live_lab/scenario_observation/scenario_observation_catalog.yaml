catalog_version: "p16.11"
scope: "controlled_scenario_observation_design_only"
execution_policy: "no_commands_no_activation_no_live_capture"
scenarios:
  - scenario_id: "icmp_flood_like"
    ciciot_family: "DoS/DDoS"
    scientific_reference_tools:
      - "hping3 reference only"
    intended_lab_role: "Future controlled ICMP-oriented observation label for isolated live lab evidence."
    expected_packet_pattern: "IP plus ICMP-dominant packet windows."
    expected_feature_shift:
      - "ICMP should increase."
      - "Rate may increase."
      - "IAT may decrease."
      - "Number may increase depending on window density."
    target_observation_node: "iot-drone-sitl or iot-smart-watch-medium"
    mqtt_topic_expected: "ids/flows/{node_id}"
    dashboard_expected_evidence:
      - "scenario label visible in the future evidence template"
      - "latest PacketWindow(30) flow visible through MQTT counters"
      - "prediction and alert visible on dashboard /demo"
      - "runtime errors remain zero"
    safety_boundary: "Design only in P16.11; no scenario activation, no live capture, no traffic generation, no executable command."
    activation_status: "design_only"
  - scenario_id: "tcp_syn_recon_like"
    ciciot_family: "Recon / DoS SYN"
    scientific_reference_tools:
      - "nmap reference only"
      - "hping3 reference only"
    intended_lab_role: "Future controlled TCP SYN-oriented observation label for isolated live lab evidence."
    expected_packet_pattern: "IP plus TCP windows with SYN-dominant behavior."
    expected_feature_shift:
      - "TCP should be active."
      - "syn_flag_number should increase."
      - "syn_count should increase."
      - "Rate may increase."
    target_observation_node: "iot-drone-sitl or iot-smart-watch-medium"
    mqtt_topic_expected: "ids/flows/{node_id}"
    dashboard_expected_evidence:
      - "scenario label visible in the future evidence template"
      - "target node visible"
      - "prediction and alert visible on dashboard /demo"
      - "runtime errors remain zero"
    safety_boundary: "Design only in P16.11; no scenario activation, no scan, no traffic generation, no executable command."
    activation_status: "design_only"
  - scenario_id: "http_slow_like"
    ciciot_family: "Web-Based / HTTP Flood"
    scientific_reference_tools:
      - "slowloris reference only"
      - "golang-httpflood reference only"
    intended_lab_role: "Future controlled HTTP-oriented observation label for isolated live lab evidence."
    expected_packet_pattern: "TCP plus HTTP request-oriented packet windows."
    expected_feature_shift:
      - "HTTP should be active."
      - "TCP should be active."
      - "Duration may increase."
      - "IAT may change."
      - "Rate may remain moderate or vary."
    target_observation_node: "iot-smart-watch-medium"
    mqtt_topic_expected: "ids/flows/{node_id}"
    dashboard_expected_evidence:
      - "scenario label visible in the future evidence template"
      - "latest PacketWindow(30) flow visible"
      - "prediction and alert visible on dashboard /demo"
      - "runtime errors remain zero"
    safety_boundary: "Design only in P16.11; no scenario activation, no web traffic generation, no live capture, no executable command."
    activation_status: "design_only"


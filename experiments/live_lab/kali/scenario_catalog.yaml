catalog_version: "p16.10"
scope: "descriptive_catalog_only"
execution_policy: "no_commands_no_scenarios_in_p16_10"
scenarios:
  - scenario_id: "icmp_flood_like"
    family: "DoS/DDoS"
    scientific_reference_tool: "hping3 reference only"
    expected_packet_pattern: "IP plus ICMP-dominant packet windows"
    expected_affected_features:
      - "ICMP"
      - "Rate"
      - "IAT"
      - "Number"
    intended_lab_observation: "Future controlled feature windows should increase ICMP and rate-oriented feature values before MQTT-to-IDS inference."
    safety_boundary: "Descriptive only in P16.10; no traffic generation, no live scenario, no executable command."
  - scenario_id: "tcp_syn_recon_like"
    family: "Recon / DoS SYN"
    scientific_reference_tool: "nmap and hping3 references only"
    expected_packet_pattern: "IP plus TCP windows with SYN-dominant behavior"
    expected_affected_features:
      - "TCP"
      - "syn_flag_number"
      - "syn_count"
      - "Rate"
    intended_lab_observation: "Future controlled feature windows should show TCP and SYN-related feature changes before MQTT-to-IDS inference."
    safety_boundary: "Descriptive only in P16.10; no scan, no live scenario, no executable command."
  - scenario_id: "http_slow_like"
    family: "Web-Based / HTTP Flood"
    scientific_reference_tool: "slowloris and golang-httpflood references only"
    expected_packet_pattern: "TCP plus HTTP request-oriented windows"
    expected_affected_features:
      - "HTTP"
      - "TCP"
      - "Duration"
      - "IAT"
      - "Rate"
    intended_lab_observation: "Future controlled feature windows should show HTTP, TCP, duration, IAT, and rate changes before MQTT-to-IDS inference."
    safety_boundary: "Descriptive only in P16.10; no web traffic generation, no live scenario, no executable command."

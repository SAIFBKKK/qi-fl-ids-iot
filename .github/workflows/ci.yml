name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  public-smoke:
    name: Public smoke checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile maintenance and smoke-test code
        run: python -m compileall scripts tests

      - name: Run public-safe tests
        run: >
          python -m pytest
          -m "not slow and not requires_dataset and not requires_artifacts and not requires_docker and not requires_live_lab"
          --tb=short
